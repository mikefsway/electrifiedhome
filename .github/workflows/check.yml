name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  site:
    name: Pages, links and writing rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/site.mjs check

  config-ids:
    # Separate so a page waiting for its config ID doesn't hide other problems.
    name: Every widget has its config ID
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/site.mjs check --ids
